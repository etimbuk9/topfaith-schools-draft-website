<section id="history" style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: flex-start">
  <div style="flex: 1 1 280px; min-width: 0">
    <p style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #8A6A00; margin: 0 0 12px">Our story</p>
    <h2 style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 28px">History and philosophy</h2>
    <address style="font-style: normal; font-size: 15px; line-height: 1.6; color: #3E4A52; border-left: 4px solid #FFD400; padding: 4px 0 4px 18px">Topfaith International Secondary School<br>Mkpatak, Essien Udim<br>Akwa Ibom State, Nigeria<br>530113</address>
  </div>
  <div style="flex: 2 1 560px; min-width: 0; max-width: 42em; font-size: 18px; line-height: 1.7; color: #2A3640">
    <p style="margin: 0 0 22px">Topfaith International Secondary School is located in Mkpatak, Essien Udim, Akwa Ibom State, Nigeria. It is a serene and conducive environment about 12km from Abak town, 14km from Ikot Ekpene town and about 23km from Uyo, the Capital City of Akwa Ibom State. Precisely, it is located at Topfaith International Secondary School, 530113, Mkpatak, Akwa Ibom, Nigeria.</p>
    <p style="margin: 0 0 22px">The School is premised on the philosophy that for many parents and guardians, the choice of a school for their wards is a very important decision to be made as a School system can make or mar a child's future. Every parent dreams of a successful, prosperous, and self-fulfilling future for his/her ward. More often than not, the realization of such a dream is directly linked to the initial orientation to which the child has been exposed in his/her childhood education.</p>
    <p style="margin: 0 0 22px">Topfaith International Secondary School is therefore a strategic response to the yearning need for qualitative early childhood education in Nigeria. For each student, the School undertakes to provide a wealth of learning opportunities for educational experience and enrichment. The School fosters and encourages the qualities of initiative, imagination and independence, associated with self-discipline and responsible behaviour. The disciplinary code is premised on fairness, friendliness and firmness.</p>
    <p style="margin: 0">Invariably the school is an environment for the children to learn and develop faith in themselves, in our country - Nigeria, and humanity in general. Being conscious of and in conformity with the Nigerian National Policy on Education, our children are taught to develop their brains, hands and spirit to create room for intellectual, emotional, social and moral growth. Faith and conviction in the Almighty Creator as the Enabler and Provider of Knowledge and as the overall Regulator of human activities is identified and emphasized in the children's daily life in and outside the school.</p>
  </div>
</section>
